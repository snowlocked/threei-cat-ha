start_clean:
  name: Start Clean
  description: Start cleaning
  target:
    entity:
      integration: threei_cat

stop_clean:
  name: Stop Clean
  description: Stop cleaning
  target:
    entity:
      integration: threei_cat

return_to_dock:
  name: Return to Dock
  description: Return the robot to its charging dock
  target:
    entity:
      integration: threei_cat

stop_recharge:
  name: Stop Recharge
  description: Stop returning to dock or stop charging
  target:
    entity:
      integration: threei_cat

set_work_mode:
  name: Set Work Mode
  description: Set the cleaning work mode
  target:
    entity:
      integration: threei_cat
  fields:
    mode:
      name: Work Mode
      description: The work mode to set
      required: true
      selector:
        select:
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"

set_water_level:
  name: Set Water Level
  description: Set the water level for mopping
  target:
    entity:
      integration: threei_cat
  fields:
    level:
      name: Water Level
      description: The water level to set
      required: true
      selector:
        select:
          options:
            - "0"
            - "1"
            - "2"
            - "3"

set_suction_level:
  name: Set Suction Level
  description: Set the vacuum suction level
  target:
    entity:
      integration: threei_cat
  fields:
    level:
      name: Suction Level
      description: The suction level to set
      required: true
      selector:
        select:
          options:
            - "0"
            - "1"
            - "2"
            - "3"
